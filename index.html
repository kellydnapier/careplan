<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Care Plan Education</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f0;--card:#fff;--border:#d1d1c7;--text:#2c2c2c;--text2:#5a5a5a;--accent:#2a6496;--accent2:#1a4a6e;--accent-bg:#e8f0f8;--red:#c0392b;--red-bg:#fdecea;--green:#27ae60;--green-bg:#eafaf1;--orange:#d4760a;--orange-bg:#fef5e7;--tab-bg:#e8e8e0;--tab-active:#2a6496;--tab-text:#fff;--shadow:0 1px 3px rgba(0,0,0,.08);--qc-blue:#2b3990;--qc-green:#00904a}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:8px}
.app-header{display:flex;align-items:center;gap:14px;padding:10px 0 4px;justify-content:center;flex-wrap:wrap}
.header-text{text-align:center}
.header-text h1{font-size:1.3em;color:var(--qc-blue);margin:0;line-height:1.2}
.header-text .subtitle{color:var(--text2);font-size:.85em;margin:0}
.main-tabs{display:flex;gap:2px;margin-bottom:8px;border-bottom:2px solid var(--accent)}
.main-tab{padding:8px 16px;cursor:pointer;font-weight:600;font-size:.9em;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:var(--tab-bg);color:var(--text2);transition:all .15s}
.main-tab.active{background:var(--accent);color:var(--tab-text)}
.main-tab:hover:not(.active){background:#d0d0c8}
.sys-tabs{display:flex;overflow-x:auto;gap:3px;padding:4px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.sys-tab{padding:5px 10px;cursor:pointer;white-space:nowrap;font-size:.8em;border-radius:4px;background:var(--tab-bg);color:var(--text2);border:1px solid var(--border);transition:all .15s;flex-shrink:0}
.sys-tab.active{background:var(--accent);color:var(--tab-text);border-color:var(--accent)}
.sys-tab:hover:not(.active){background:#d0d0c8}
.cond-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cond-item{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:4px;font-size:.85em;cursor:pointer;transition:all .15s}
.cond-item:hover{border-color:var(--accent)}
.cond-item.checked{background:var(--accent-bg);border-color:var(--accent)}
.cond-item input{margin:0}
.pg-box{display:flex;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.pg-half{flex:1;padding:10px 14px;background:var(--card)}
.pg-half:first-child{border-right:1px solid var(--border)}
.pg-label{font-weight:700;font-size:.85em;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.pg-text{font-size:.88em;line-height:1.5}
.note-section{background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;box-shadow:var(--shadow)}
.note-header{padding:10px 14px;font-weight:600;font-size:.95em;background:var(--accent);color:var(--tab-text);border-radius:5px 5px 0 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.note-header .toggle{font-size:.7em;opacity:.8}
.note-body{padding:12px 14px;font-size:.88em;white-space:pre-wrap;word-wrap:break-word;line-height:1.6;max-height:400px;overflow-y:auto}
.note-body.collapsed{display:none}
.intervention-line{font-style:italic;font-size:.92em;color:var(--text2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border);line-height:1.5}
.cond-title{font-weight:700;font-size:1em;color:var(--accent2);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.cond-divider{border:none;border-top:1px dashed var(--border);margin:12px 0}
.emergency-section{margin-bottom:10px}
.emergency-label{font-weight:700;padding:6px 10px;border-radius:4px;margin-bottom:4px;font-size:.9em}
.label-911{background:var(--red-bg);color:var(--red)}
.label-provider{background:var(--orange-bg);color:var(--orange)}
.bullet-list{margin-bottom:6px;padding-left:6px}
.bullet-item{padding:2px 0 2px 0;line-height:1.5}
.diet-overview{background:var(--accent-bg);border:1px solid #c5d8e8;border-radius:5px;padding:10px 12px;margin-bottom:10px;font-size:.9em;line-height:1.5;color:var(--text)}
.diet-overview-title{font-weight:700;color:var(--accent2);margin-bottom:4px}
.diet-cat{margin-bottom:8px}
.diet-cat-label{font-weight:600;font-size:.9em;padding:3px 8px;border-radius:3px;margin-bottom:3px;display:inline-block}
.eat-more-label{background:var(--green-bg);color:var(--green)}
.limit-label{background:var(--orange-bg);color:var(--orange)}
.avoid-label{background:var(--red-bg);color:var(--red)}
.guidelines-label{background:var(--accent-bg);color:var(--accent)}
.empty-state{text-align:center;padding:40px;color:var(--text2);font-size:.95em}
.editor-section{background:var(--card);padding:14px;border-radius:6px;border:1px solid var(--border);margin-bottom:10px}
.editor-section h3{font-size:1em;margin-bottom:8px;color:var(--accent2)}
.editor-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.editor-row label{font-size:.85em;min-width:100px}
.editor-row input,.editor-row select,.editor-row textarea{font-size:.85em;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-family:inherit}
.editor-row textarea{width:100%;min-height:120px;resize:vertical}
.btn{padding:6px 14px;font-size:.85em;border:none;border-radius:4px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#a93226}
.btn-secondary{background:var(--tab-bg);color:var(--text)}.btn-secondary:hover{background:#d0d0c8}
.btn-sm{padding:3px 8px;font-size:.8em}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
@media print{.main-tabs,.sys-tabs,.cond-list,.btn,.btn-group,.editor-section,.app-header{display:none!important}.note-body.collapsed{display:block!important}.app{max-width:100%}}
@media(max-width:600px){.main-tab{padding:6px 10px;font-size:.8em}.note-body{font-size:.82em;max-height:300px}.pg-box{flex-direction:column}.pg-half:first-child{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
<div class="app-header">
  <div class="header-text">
    <h1>Care Plan Education</h1>
    <p class="subtitle">Clinical Reference for Complex Case Management</p>
  </div>
</div>
<div class="main-tabs">
  <div class="main-tab active" onclick="switchMain('builder')">Knowledge Deficit</div>
  <div class="main-tab" onclick="switchMain('editor')">Data Editor</div>
</div>
<div id="builder-view">
  <div class="sys-tabs" id="sys-tabs"></div>
  <div class="cond-list" id="cond-list"></div>
  <div id="pg-area"></div>
  <div id="notes-area"></div>
</div>
<div id="editor-view" style="display:none">
  <div class="editor-section">
    <h3>Data Editor</h3>
    <p style="font-size:.85em;color:var(--text2);margin-bottom:10px">Select a body system tab, then a condition to edit its content. Changes are session-only until exported.</p>
    <div class="sys-tabs" id="ed-sys-tabs"></div>
    <div id="ed-cond-list" class="cond-list" style="margin-bottom:10px"></div>
    <div id="ed-form"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="exportData()">Export data.json</button>
      <button class="btn btn-secondary" onclick="revertData()">Revert All Changes</button>
    </div>
  </div>
</div>
</div>
<script>
let DATA=null,originalData=null,activeSys=0,selectedConds={},collapsedSections={},edActiveSys=0,edActiveCond=null;
async function loadData(){try{const r=await fetch('data.json');DATA=await r.json()}catch(e){DATA={body_systems:["No Data"],conditions:{"No Data":[]},condition_data:{},intervention_labels:[],care_plan_templates:{}}}originalData=JSON.parse(JSON.stringify(DATA));initApp()}
function initApp(){renderSysTabs();renderEdSysTabs();selectSystem(0)}
function switchMain(v){document.querySelectorAll('.main-tab').forEach((t,i)=>t.classList.toggle('active',v==(i==0?'builder':'editor')));document.getElementById('builder-view').style.display=v=='builder'?'':'none';document.getElementById('editor-view').style.display=v=='editor'?'':'none'}
function renderSysTabs(){document.getElementById('sys-tabs').innerHTML=DATA.body_systems.map((s,i)=>`<div class="sys-tab${i==activeSys?' active':''}" onclick="selectSystem(${i})">${s}</div>`).join('')}
function selectSystem(i){activeSys=i;selectedConds={};document.querySelectorAll('#sys-tabs .sys-tab').forEach((t,j)=>t.classList.toggle('active',j==i));renderConditions();renderNotes()}
function renderConditions(){const sys=DATA.body_systems[activeSys],conds=DATA.conditions[sys]||[],c=document.getElementById('cond-list');if(!conds.length){c.innerHTML='<div class="empty-state">No conditions in this category yet.</div>';return}c.innerHTML=conds.map(cn=>{const chk=selectedConds[cn]?'checked':'';return`<label class="cond-item${chk?' checked':''}"><input type="checkbox" ${chk} onchange="toggleCond('${cn.replace(/'/g,"\\'")}',this.checked)">${cn}</label>`}).join('')}
function toggleCond(cn,v){if(v)selectedConds[cn]=true;else delete selectedConds[cn];renderConditions();renderNotes()}
function fmtCondList(sel){if(sel.length===1)return sel[0].toLowerCase();if(sel.length===2)return sel[0].toLowerCase()+' and '+sel[1].toLowerCase();return sel.slice(0,-1).map(s=>s.toLowerCase()).join(', ')+', and '+sel[sel.length-1].toLowerCase()}
function dedup(arr){const seen=new Set();return arr.filter(item=>{const k=item.toLowerCase().replace(/[^a-z0-9]/g,'');if(seen.has(k))return false;seen.add(k);return true})}
function mergeDietLists(conds,field){const items=[];conds.forEach(cn=>{const d=DATA.condition_data[cn]?.diet;if(d&&d[field])items.push(...d[field])});return dedup(items)}
function mergeEmergency(conds,field){const items=[];conds.forEach(cn=>{const e=DATA.condition_data[cn]?.emergency;if(e&&e[field])items.push(...e[field])});return dedup(items)}

// Build bullet list using text bullets so they copy/paste
function bulletList(items){return'<div class="bullet-list">'+items.map(i=>`<div class="bullet-item">• ${escHtml(i)}</div>`).join('')+'</div>'}

function renderNotes(){
  const area=document.getElementById('notes-area'),pgArea=document.getElementById('pg-area'),sel=Object.keys(selectedConds);
  if(!sel.length){pgArea.innerHTML='';area.innerHTML='<div class="empty-state">Select one or more conditions above to generate care plan notes.</div>';return}
  const condStr=fmtCondList(sel);
  pgArea.innerHTML=`<div class="pg-box"><div class="pg-half"><div class="pg-label">Problem</div><div class="pg-text">Knowledge deficit related to ${escHtml(condStr)} self management.</div></div><div class="pg-half"><div class="pg-label">Goal</div><div class="pg-text">Member will verbalize understanding of ${escHtml(condStr)} disease process, self management, and when to seek help.</div></div></div>`;
  let html='';
  // 1. Education
  const eduInt=`<div class="intervention-line">Case manager to provide education on ${escHtml(condStr)} including pathophysiology, risk factors, self management, and expected outcomes.</div>`;
  const eduContent=sel.map(cn=>{const ed=DATA.condition_data[cn]?.education||'';if(sel.length>1)return`<div class="cond-title">${escHtml(cn)}</div>\n${escHtml(ed)}`;return escHtml(ed)}).join(sel.length>1?'\n<hr class="cond-divider">\n':'\n');
  html+=renderSectionHtml('Education and Self Management',eduInt+eduContent);
  // 2. Diet
  const dietConds=sel.filter(cn=>DATA.condition_data[cn]?.diet);
  if(dietConds.length){
    const dietInt=`<div class="intervention-line">Case manager to educate member on proper diet and assist in dietary modifications to better manage chronic condition.</div>`;
    let dh='';if(dietConds.length===1){dh=renderDietSingle(dietConds[0])}else{dh=renderDietMerged(dietConds)}
    html+=renderSectionHtml('Dietary Education',dietInt+dh);
  }
  // 3. Emergency
  const emergConds=sel.filter(cn=>DATA.condition_data[cn]?.emergency);
  if(emergConds.length){
    const emergInt=`<div class="intervention-line">Case manager to educate member on which s/sx require emergency medical treatment and which s/sx require provider notification.</div>`;
    let eh='';if(emergConds.length===1){eh=renderEmergSingle(emergConds[0])}else{eh=renderEmergMerged(emergConds)}
    html+=renderSectionHtml('When to Call 911 vs When to Call Provider',emergInt+eh);
  }
  // 4. Educational Materials
  const matInt=`<div class="intervention-line">Provide or send educational resources, including online links, for disease education and management.</div>`;
  const matC=sel.map(cn=>{const o=DATA.condition_data[cn]?.online||'';return o?(sel.length>1?`<div class="cond-title">${escHtml(cn)}</div>\n${escHtml(o)}`:escHtml(o)):''}).filter(Boolean).join('\n<hr class="cond-divider">\n');
  html+=renderSectionHtml('Educational Materials',matInt+(matC||'To be added.'));
  // 5. Community Resources
  const comInt=`<div class="intervention-line">Refer to Community Resources</div>`;
  const comC=sel.map(cn=>{const c=DATA.condition_data[cn]?.community||'';return c?(sel.length>1?`<div class="cond-title">${escHtml(cn)}</div>\n${escHtml(c)}`:escHtml(c)):''}).filter(Boolean).join('\n<hr class="cond-divider">\n');
  html+=renderSectionHtml('Community Resources',comInt+(comC||'To be added.'));
  area.innerHTML=html;
}
function renderSectionHtml(title,html){const id='sec_'+title.replace(/\W/g,'');const col=collapsedSections[id];return`<div class="note-section"><div class="note-header" onclick="toggleSection('${id}')"><span>${title}</span><span class="toggle">${col?'▶':'▼'}</span></div><div class="note-body${col?' collapsed':''}" id="${id}">${html}</div></div>`}
function toggleSection(id){collapsedSections[id]=!collapsedSections[id];const el=document.getElementById(id);if(el)el.classList.toggle('collapsed');const hdr=el?.previousElementSibling;if(hdr){const t=hdr.querySelector('.toggle');if(t)t.textContent=collapsedSections[id]?'▶':'▼'}}
function renderDietSingle(cn){const d=DATA.condition_data[cn]?.diet;if(!d)return'';let h='';if(d.overview)h+=`<div class="diet-overview"><div class="diet-overview-title">${escHtml(cn)} — Dietary Overview</div>${escHtml(d.overview)}</div>`;h+=buildDietHtml(d.eat_more,d.limit,d.avoid,d.guidelines);return h}
function renderDietMerged(conds){let h=`<p style="margin-bottom:8px;font-style:italic;color:var(--text2)">Combined dietary guidelines for: ${conds.join(', ')}</p>`;conds.forEach(cn=>{const d=DATA.condition_data[cn]?.diet;if(d?.overview)h+=`<div class="diet-overview"><div class="diet-overview-title">${escHtml(cn)} — Dietary Overview</div>${escHtml(d.overview)}</div>`});h+=buildDietHtml(mergeDietLists(conds,'eat_more'),mergeDietLists(conds,'limit'),mergeDietLists(conds,'avoid'),mergeDietLists(conds,'guidelines'));return h}
function buildDietHtml(em,lm,av,gl){let h='';if(em?.length)h+=`<div class="diet-cat"><div class="diet-cat-label eat-more-label">Eat More</div>${bulletList(em)}</div>`;if(lm?.length)h+=`<div class="diet-cat"><div class="diet-cat-label limit-label">Limit</div>${bulletList(lm)}</div>`;if(av?.length)h+=`<div class="diet-cat"><div class="diet-cat-label avoid-label">Avoid</div>${bulletList(av)}</div>`;if(gl?.length)h+=`<div class="diet-cat"><div class="diet-cat-label guidelines-label">Guidelines</div>${bulletList(gl)}</div>`;return h||'No dietary information available.'}
function renderEmergSingle(cn){const e=DATA.condition_data[cn]?.emergency;if(!e)return'';return buildEmergHtml(e.call_911,e.call_provider)}
function renderEmergMerged(conds){const c9=mergeEmergency(conds,'call_911'),cp=mergeEmergency(conds,'call_provider');let h=`<p style="margin-bottom:8px;font-style:italic;color:var(--text2)">Combined emergency guidelines for: ${conds.join(', ')}</p>`;h+=buildEmergHtml(c9,cp);return h}
function buildEmergHtml(c9,cp){let h='';if(c9?.length)h+=`<div class="emergency-section"><div class="emergency-label label-911">When to Call 911</div><p style="margin-bottom:4px;font-size:.85em">Call 911 or go to the nearest emergency department immediately if you experience:</p>${bulletList(c9)}</div>`;if(cp?.length)h+=`<div class="emergency-section"><div class="emergency-label label-provider">When to Call Provider</div><p style="margin-bottom:4px;font-size:.85em">Contact the healthcare provider if you experience:</p>${bulletList(cp)}</div>`;return h||'No emergency information available.'}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// === EDITOR ===
function renderEdSysTabs(){document.getElementById('ed-sys-tabs').innerHTML=DATA.body_systems.map((s,i)=>`<div class="sys-tab${i==edActiveSys?' active':''}" onclick="edSelectSystem(${i})">${s}</div>`).join('')}
function edSelectSystem(i){edActiveSys=i;edActiveCond=null;document.querySelectorAll('#ed-sys-tabs .sys-tab').forEach((t,j)=>t.classList.toggle('active',j==i));renderEdConds();document.getElementById('ed-form').innerHTML=''}
function renderEdConds(){const sys=DATA.body_systems[edActiveSys],conds=DATA.conditions[sys]||[],c=document.getElementById('ed-cond-list');c.innerHTML=conds.map(cn=>`<div class="cond-item${edActiveCond==cn?' checked':''}" onclick="edSelectCond('${cn.replace(/'/g,"\\'")}')" style="cursor:pointer">${cn}</div>`).join('')+`<button class="btn btn-sm btn-primary" onclick="edAddCond()">+ Add Condition</button>`}
function edSelectCond(cn){edActiveCond=cn;renderEdConds();renderEdForm(cn)}
function renderEdForm(cn){const d=DATA.condition_data[cn]||{};const hasDiet=d.diet!=null;document.getElementById('ed-form').innerHTML=`<h3 style="margin-bottom:10px">Editing: ${cn}</h3><div class="editor-row"><label>Education:</label></div><div class="editor-row"><textarea id="ed-edu" rows="10">${d.education||''}</textarea></div><div class="editor-row"><label><input type="checkbox" id="ed-has-diet" ${hasDiet?'checked':''} onchange="toggleEdDiet()"> Has Dietary Guidelines</label></div><div id="ed-diet-fields" style="display:${hasDiet?'block':'none'}"><div class="editor-row"><label>Diet Overview:</label></div><div class="editor-row"><textarea id="ed-diet-overview" rows="3">${(d.diet?.overview||'')}</textarea></div><div class="editor-row"><label>Eat More (one per line):</label></div><div class="editor-row"><textarea id="ed-eat-more" rows="4">${(d.diet?.eat_more||[]).join('\n')}</textarea></div><div class="editor-row"><label>Limit (one per line):</label></div><div class="editor-row"><textarea id="ed-limit" rows="4">${(d.diet?.limit||[]).join('\n')}</textarea></div><div class="editor-row"><label>Avoid (one per line):</label></div><div class="editor-row"><textarea id="ed-avoid" rows="4">${(d.diet?.avoid||[]).join('\n')}</textarea></div><div class="editor-row"><label>Guidelines (one per line):</label></div><div class="editor-row"><textarea id="ed-guidelines" rows="4">${(d.diet?.guidelines||[]).join('\n')}</textarea></div></div><div class="editor-row"><label>Call 911 (one per line):</label></div><div class="editor-row"><textarea id="ed-911" rows="5">${(d.emergency?.call_911||[]).join('\n')}</textarea></div><div class="editor-row"><label>Call Provider (one per line):</label></div><div class="editor-row"><textarea id="ed-prov" rows="5">${(d.emergency?.call_provider||[]).join('\n')}</textarea></div><div class="editor-row"><label>Educational Materials:</label></div><div class="editor-row"><textarea id="ed-online" rows="4">${d.online||''}</textarea></div><div class="editor-row"><label>Community Resources:</label></div><div class="editor-row"><textarea id="ed-community" rows="4">${d.community||''}</textarea></div><div class="btn-group"><button class="btn btn-primary" onclick="edSave()">Save Changes</button><button class="btn btn-danger" onclick="edDeleteCond()">Delete Condition</button></div>`}
function toggleEdDiet(){document.getElementById('ed-diet-fields').style.display=document.getElementById('ed-has-diet').checked?'block':'none'}
function linesToArr(id){return document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean)}
function edSave(){if(!edActiveCond)return;const hasDiet=document.getElementById('ed-has-diet').checked;DATA.condition_data[edActiveCond]={education:document.getElementById('ed-edu').value,diet:hasDiet?{overview:document.getElementById('ed-diet-overview').value,eat_more:linesToArr('ed-eat-more'),limit:linesToArr('ed-limit'),avoid:linesToArr('ed-avoid'),guidelines:linesToArr('ed-guidelines')}:null,emergency:{call_911:linesToArr('ed-911'),call_provider:linesToArr('ed-prov')},online:document.getElementById('ed-online').value,community:document.getElementById('ed-community').value};alert('Saved! Export to save permanently.')}
function edAddCond(){const name=prompt('Enter new condition name:');if(!name||!name.trim())return;const sys=DATA.body_systems[edActiveSys];if(!DATA.conditions[sys])DATA.conditions[sys]=[];DATA.conditions[sys].push(name.trim());DATA.condition_data[name.trim()]={education:'',diet:null,emergency:{call_911:[],call_provider:[]},online:'',community:''};renderEdConds();renderConditions()}
function edDeleteCond(){if(!edActiveCond||!confirm(`Delete "${edActiveCond}"?`))return;const sys=DATA.body_systems[edActiveSys];DATA.conditions[sys]=DATA.conditions[sys].filter(c=>c!==edActiveCond);delete DATA.condition_data[edActiveCond];edActiveCond=null;renderEdConds();renderConditions();document.getElementById('ed-form').innerHTML=''}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click()}
function revertData(){if(!confirm('Revert all changes?'))return;DATA=JSON.parse(JSON.stringify(originalData));selectedConds={};edActiveCond=null;initApp()}
loadData();
</script>
</body>
</html>
